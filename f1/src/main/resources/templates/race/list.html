<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Race List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <style>
        body {
            color: white;
            background-image: url('/Background.png');
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .f1-header {
            background-color: #15151e;
            padding: 10px 20px;
        }
        .f1-header .nav-link {
            color: white;
            font-weight: bold;
            text-transform: uppercase;
            margin-right: 20px;
        }
        .f1-logo {
            height: 30px;
            margin-right: 20px;
        }
        .main{
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        .alert {
            background-color: #3b3b3b;
            color: white;
            border-color: #3b3b3b;
        }
        .table-custom {
            background-color: #3b3b3b;
            color: white;
            border-color: #141414;
        }
        .table-custom th {
            background-color: #141414;
            color: white;
            font-weight: bold;
            text-transform: uppercase;
        }
        .table-custom td {
            background-color: transparent;
            color: white;
        }
    </style>
</head>
<body>
<header class="f1-header d-flex justify-content-between align-items-center">
    <div class="d-flex align-items-center">
        <a th:href="@{/}"><img src="/Logo.png" alt="F1 Logo" class="f1-logo"></a>
    </div>
    <nav class="d-flex">
        <a class="nav-link" href="/list">Schedule</a>
        <a class="nav-link" href="https://www.formula1.com/en/results/2025/races">Results</a>
        <a class="nav-link" href="https://www.formula1.com/en/latest">News</a>
        <a class="nav-link" href="https://www.formula1.com/en/drivers">Drivers</a>
    </nav>
</header>
<div class="container mt-5">
    <h2>Race List</h2>

    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>

    <a href="/create" class="btn btn-dark btn-success mb-3">Add New Race</a>

    <table class="table table-bordered table-custom">
        <thead>
        <tr>
            <th>Race Name</th>
            <th>Location</th>
            <th>Date</th>
            <th>Time</th>
            <th>Status</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="race : ${races}">
            <td th:text="${race.raceName}">Race Name</td>
            <td th:text="${race.location}">Location</td>
            <td th:text="${race.date}">Date</td>
            <td th:text="${race.time}">Time</td>
            <td th:text="${race.status}">Status</td>
            <td>
                <a th:href="@{/edit/{id}(id=${race.id})}" class="btn btn-dark btn-sm me-2 fw-bold">Edit</a>
                <a th:href="@{/delete/{id}(id=${race.id})}" class="btn btn-danger btn-sm fw-bold"
                   onclick="return confirm('Are you sure you want to delete this race?');">Delete</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
