<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Add Race</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <style>
        body {
            color: white;
            background-image: url('/Background.png');
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .f1-header {
            background-color: #15151e;
            padding: 10px 20px;
        }
        .f1-header .nav-link {
            color: white;
            font-weight: bold;
            text-transform: uppercase;
            margin-right: 20px;
        }
        .f1-logo {
            height: 30px;
            margin-right: 20px;
        }
        .alert {
            background-color: #3b3b3b;
            color: white;
            border-color: #3b3b3b;
        }
    </style>
</head>
<body>
<header class="f1-header d-flex justify-content-between align-items-center">
    <div class="d-flex align-items-center">
        <a th:href="@{/}"><img src="/Logo.png" alt="F1 Logo" class="f1-logo"></a>
    </div>
    <nav class="d-flex">
        <a class="nav-link" href="/list">Schedule</a>
        <a class="nav-link" href="https://www.formula1.com/en/results/2025/races">Results</a>
        <a class="nav-link" href="https://www.formula1.com/en/latest">News</a>
        <a class="nav-link" href="https://www.formula1.com/en/drivers">Drivers</a>
    </nav>
</header>
<div class="container mt-5">
    <h2>Add Race</h2>

    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>

    <form th:action="@{/create}" th:object="${race}" method="post">
        <div class="mb-3">
            <label for="raceName" class="form-label">Race Name</label>
            <input type="text" th:field="*{raceName}" id="raceName" class="form-control"/>
        </div>

        <div class="mb-3">
            <label for="location" class="form-label">Location</label>
            <input type="text" th:field="*{location}" id="location" class="form-control"/>
        </div>

        <div class="mb-3">
            <label for="date" class="form-label">Date</label>
            <input type="date" th:field="*{date}" id="date" class="form-control"/>
        </div>

        <div class="mb-3">
            <label for="time" class="form-label">Time</label>
            <input type="time" th:field="*{time}" id="time" class="form-control"/>
        </div>

        <div class="mb-3">
            <label for="status" class="form-label">Status</label>
            <input type="text" th:field="*{status}" id="status" class="form-control"/>
        </div>

        <button type="submit" class="btn btn-dark btn-primary">Save</button>
    </form>
</div>
</body>
</html>
